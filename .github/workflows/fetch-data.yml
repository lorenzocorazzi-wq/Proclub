name: Fetch EA Pro Clubs Data

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  workflow_dispatch:        # trigger manuale

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from EA API
        run: node scripts/fetch-ea-data.js

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update EA data [$(date -u +%Y-%m-%dT%H:%M)]"
          git push
